name: CI · тесты и сборка Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: Тесты (Ubuntu, offscreen Qt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Системные библиотеки Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Тесты
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Проверка баз и демо-данных
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python main.py --check --no-demo
          python apple_flash_main.py --check --no-demo

  build-windows:
    name: Сборка Windows (Apple Flash Studio EXE + установщик)
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Тесты (Windows)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Сборка Apple Flash Studio (EXE + Portable ZIP + Setup EXE)
        shell: pwsh
        run: |
          ./scripts/build_apple_flash_windows.ps1 -Version "1.0.0" -SkipTests -UseCurrentPython

      - name: Проверка артефактов
        shell: pwsh
        run: |
          if (!(Test-Path "dist/AppleFlashStudio/AppleFlashStudio.exe")) { throw "AppleFlashStudio.exe не создан" }
          Get-ChildItem installer/Output -ErrorAction Stop | Format-Table Name, Length

      - name: "Артефакт: Apple Flash Studio (Windows)"
        uses: actions/upload-artifact@v4
        with:
          name: AppleFlashStudio-Windows
          path: |
            installer/Output/AppleFlashStudio-1.0.0-setup.exe
            installer/Output/AppleFlashStudio-1.0.0-portable-win64.zip
          if-no-files-found: error

      - name: Публикация сборки для скачивания (GitHub Release / Pre-release)
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/arena/') || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('apple-flash-build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: "Apple Flash Studio v1.0.0 (сборка #${{ github.run_number }})"
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: |
            installer/Output/AppleFlashStudio-1.0.0-setup.exe
            installer/Output/AppleFlashStudio-1.0.0-portable-win64.zip
          body: |
            Готовая сборка **Apple Flash Studio v1.0.0** для Windows 10/11 (x64) — перепрошивка и восстановление **iPhone, iPad и MacBook (Apple Silicon M1–M4 / Intel T2)**.

            ### Файлы для скачивания:
            - **`AppleFlashStudio-1.0.0-setup.exe`** — установщик для Windows 10/11 (создаёт ярлык в меню «Пуск» и на рабочем столе).
            - **`AppleFlashStudio-1.0.0-portable-win64.zip`** — портативная версия без установки (распакуйте архив в любую папку и запустите `AppleFlashStudio.exe`).

            В сборку уже включён интерфейс `PySide6` и Python-бэкенд `pymobiledevice3`.
