name: CI · тесты и сборка Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Windows использует cp1252 для перенаправленного вывода — кириллица в логах
  # Python падает с UnicodeEncodeError без принудительного UTF-8.
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  tests:
    name: Тесты (Ubuntu, offscreen Qt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Системные библиотеки Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Тесты
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Проверка базы и демо-данных
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python main.py --check --no-demo
          python - <<'PY'
          from repair_os.services.context import AppContext
          import tempfile
          ctx = AppContext.create(tempfile.mkdtemp())
          print(ctx.describe())
          print(ctx.demo_counts())
          ctx.close()
          PY

  build-windows:
    name: Сборка Windows (EXE + установщик)
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Тесты (Windows)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Версия сборки
        id: ver
        shell: pwsh
        run: |
          $version = python -c "from repair_os import version; print(version.APP_VERSION)"
          if ($env:GITHUB_REF -like "refs/tags/v*") { $version = $env:GITHUB_REF_NAME }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Версия сборки: $version"

      - name: Сборка EXE и установщика
        shell: pwsh
        run: |
          ./scripts/build_windows.ps1 -Version "${{ steps.ver.outputs.version }}" -SkipTests -RequireInstaller

      - name: "Артефакт: журналы сборки"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/logs/*.log
          if-no-files-found: warn

      - name: Проверка артефактов
        shell: pwsh
        run: |
          if (!(Test-Path "dist/SmartphoneRepairOS/SmartphoneRepairOS.exe")) { throw "EXE не создан" }
          $installer = Get-ChildItem "installer/Output/*setup.exe" -ErrorAction SilentlyContinue
          if (-not $installer) { throw "Установщик не создан" }
          Get-ChildItem installer/Output | Format-Table Name, Length

      - name: "Артефакт: портативная сборка"
        uses: actions/upload-artifact@v4
        with:
          name: SmartphoneRepairOS-portable
          path: dist/SmartphoneRepairOS/**
          if-no-files-found: error

      - name: "Артефакт: установщик и портативная сборка"
        uses: actions/upload-artifact@v4
        with:
          name: SmartphoneRepairOS-installer
          path: |
            installer/Output/*.exe
            installer/Output/*.zip
          if-no-files-found: error

      - name: Публикация в Release (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Smartphone Repair OS ${{ github.ref_name }}"
          draft: false
          generate_release_notes: true
          files: |
            installer/Output/*.exe
            installer/Output/*.zip
          body: |
            Установщик Windows 10/11 (x64). MVP-версия.

            Портативная сборка доступна в артефактах workflow (SmartphoneRepairOS-portable).
            Все демонстрационные данные помечены как ДЕМО и не являются проверенными
            прошивками, схемами или 3D-моделями.
