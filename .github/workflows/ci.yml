name: CI

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # ---------------------------------------------------------------- tests ----
  tests:
    name: Сборка библиотек и тесты (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Кэш NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Версии SDK
        run: dotnet --info

      - name: Восстановление пакетов
        id: restore
        shell: bash
        run: |
          set -o pipefail
          dotnet restore NexusFirmware.sln 2>&1 | tee restore.log

      - name: Аннотации ошибок восстановления
        if: failure()
        shell: bash
        run: |
          grep -E "(error|Ошибка|Unable|not found)" restore.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Сборка библиотек и тестов
        id: build
        shell: bash
        run: |
          set -o pipefail
          dotnet build tests/NexusFirmware.UnitTests/NexusFirmware.UnitTests.csproj -c Release --no-restore 2>&1 | tee build.log
          dotnet build tests/NexusFirmware.IntegrationTests/NexusFirmware.IntegrationTests.csproj -c Release --no-restore 2>&1 | tee -a build.log

      - name: Аннотации ошибок сборки
        if: failure()
        shell: bash
        run: |
          grep -E "error [A-Za-z]+[0-9]+" build.log | sort -u | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Тесты
        id: tests
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/NexusFirmware.UnitTests/NexusFirmware.UnitTests.csproj -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory TestResults 2>&1 | tee unit.log

      - name: Интеграционные тесты
        id: integration
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/NexusFirmware.IntegrationTests/NexusFirmware.IntegrationTests.csproj -c Release --no-build --logger "trx;LogFileName=integration.trx" --results-directory TestResults 2>&1 | tee integration.log

      - name: Аннотации ошибок тестов
        if: failure()
        shell: bash
        run: |
          for log in unit.log integration.log; do
            [ -f "$log" ] || continue
            awk '
              /^  Failed /   { flag=1; buf=$0; next }
              flag && NF==0  { print "::error::" substr(buf,1,900); flag=0; next }
              flag           { buf=buf " || " $0 }
              END            { if (flag) print "::error::" substr(buf,1,900) }
            ' "$log" | head -25
          done

      - name: Публикация результатов тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  # -------------------------------------------------------------- windows ----
  windows:
    name: Сборка приложения, EXE и установщика (Windows)
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Установка .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Кэш NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Восстановление решения
        run: dotnet restore NexusFirmware.sln

      - name: Сборка решения
        id: build
        shell: bash
        run: |
          set -o pipefail
          dotnet build NexusFirmware.sln -c Release --no-restore 2>&1 | tee build.log

      - name: Аннотации ошибок сборки
        if: failure()
        shell: bash
        run: |
          grep -E "error [A-Za-z]+[0-9]+" build.log | sort -u | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Публикация приложения (self-contained, win-x64)
        shell: pwsh
        run: |
          dotnet publish src/NexusFirmware.App/NexusFirmware.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none `
            -o artifacts/publish

      - name: Проверка содержимого публикации
        shell: pwsh
        run: |
          Get-ChildItem artifacts/publish | Format-Table Name, Length
          if (-not (Test-Path artifacts/publish/NexusFirmwareStudio.exe)) { throw "EXE не создан" }

      - name: Установка Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Сборка установщика
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\nexus.iss
          Get-ChildItem installer\Output

      - name: Экспорт артефактов
        uses: actions/upload-artifact@v4
        with:
          name: nexus-firmware-studio-windows
          path: |
            installer/Output/*.exe
            artifacts/publish/NexusFirmwareStudio.exe
          if-no-files-found: error

  # ---------------------------------------------------------------- release ---
  release:
    name: Публикация релиза
    runs-on: ubuntu-latest
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Загрузка установщика
        uses: actions/download-artifact@v4
        with:
          name: nexus-firmware-studio-windows
          path: dist

      - name: Создание релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: NEXUS Firmware Studio ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build {0}', github.run_number) }}
          draft: false
          prerelease: false
          body: |
            Автоматическая сборка NEXUS Firmware Studio.

            **Установщик:** `NEXUS-Firmware-Studio-Setup-*.exe` (Windows 10/11 x64).
            **Портативная версия:** `NexusFirmwareStudio.exe`.

            Приложение не содержит обхода защиты устройств: операции записи выполняются только
            через документированные интерфейсы (ADB/Fastboot) и требуют явного подтверждения.
            Samsung Odin, MediaTek BROM/SLA/DAA и Qualcomm Firehose — только подготовка
            (генерация плана и отчёта) для официальных инструментов, установленных пользователем.
          files: |
            dist/installer/Output/*.exe
            dist/artifacts/publish/NexusFirmwareStudio.exe
          fail_on_unmatched_files: false

  # --------------------------------------------------------------- preview ---
  preview:
    name: Предпросмотр сборки (установщик)
    runs-on: ubuntu-latest
    needs: windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
    permissions:
      contents: write
    steps:
      - name: Загрузка установщика
        uses: actions/download-artifact@v4
        with:
          name: nexus-firmware-studio-windows
          path: dist

      - name: Публикация предпросмотра
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-build-${{ github.run_number }}
          name: NEXUS Firmware Studio — предпросмотр сборки ${{ github.run_number }}
          prerelease: true
          body: |
            Предварительная сборка NEXUS Firmware Studio из ветки `${{ github.ref_name }}`
            (коммит `${{ github.sha }}`).

            **Установщик:** `NEXUS-Firmware-Studio-Setup-*.exe` (Windows 10/11 x64).
            **Портативная версия:** `NexusFirmwareStudio.exe`.

            Это предпросмотр: приложение проверено автотестами и собирается, но не проходило
            приёмочное тестирование на реальных устройствах. Запись на устройство выполняется
            только после явных подтверждений; Samsung Odin, MediaTek BROM и Qualcomm Firehose
            не реализованы — доступна только подготовка пакета и отчёта.
          files: |
            dist/installer/Output/*.exe
            dist/artifacts/publish/NexusFirmwareStudio.exe
          fail_on_unmatched_files: false
