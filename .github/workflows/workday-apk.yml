name: Work Day APK

# Собирает debug-APK и кладёт его в релиз workday-latest, чтобы ссылка на загрузку была постоянная:
# https://github.com/Klavish777/test/releases/download/workday-latest/WorkDay-debug.apk

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/workday-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Тесты домена + сборка debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (platform 35)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -3
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      # Ключ подписи должен быть одним и тем же от сборки к сборке: на его SHA-1
      # настраивается OAuth-клиент Google, и «уплывший» отпечаток ломал бы вход
      # (redirect_uri_mismatch / invalid_client). Кладём его в кэш раннера.
      - name: Debug-ключ подписи (постоянный между прогонами)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: workday-debug-keystore-v1

      - name: Создать debug-ключ, если кэша ещё нет
        run: |
          set -o pipefail
          KS="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -v -keystore "$KS" -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 \
              -dname "CN=Android Debug,O=Android,C=US" -validity 10000 2>&1 | tail -2
          fi
          ls -l "$KS"

      - name: Gradle 8.11.1 + кэш зависимостей
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Юнит-тесты домена
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee /tmp/test.log

      - name: Сборка APK
        id: apk
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      # Логи Actions из песочницы не скачать, а ошибки компиляции нужны — кладём их в коммит.
      - name: Отдать лог сборки в репозиторий
        if: failure()
        run: |
          {
            echo "## Что упало"
            grep -hE "What went wrong|^e: |error:|FAILURE:|Caused by:|Unresolved reference|expected:" /tmp/test.log /tmp/build.log 2>/dev/null | head -80
            if [ -d android/app/build/test-results/testDebugUnitTest ]; then
              echo; echo "## Провалившиеся тесты"
              python3 - <<'PYT'
          import glob, xml.etree.ElementTree as ET
          for f in sorted(glob.glob('android/app/build/test-results/testDebugUnitTest/*.xml')):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for node in list(tc):
                      if node.tag in ('failure', 'error'):
                          msg = ' | '.join((node.get('message') or '').split())[:400]
                          trace = (node.text or '').splitlines()
                          where = next((l.strip() for l in trace if '.kt:' in l), '')[:180]
                          print(f"* {tc.get('name')}\n    {msg}\n    {where}")
          PYT
            fi
            echo; echo "## Хвост лога"
            tail -n 25 /tmp/build.log 2>/dev/null || tail -n 25 /tmp/test.log
          } > ci-build.log
          head -c 200 ci-build.log
          git config user.name "workday-ci"
          git config user.email "workday-ci@users.noreply.github.com"
          git add -f ci-build.log
          git commit -q -m "ci: лог сборки [skip ci]" || echo "нечего пушить"
          # гонка с пользовательским пушем — тянем ветку и переприкручиваем, иначе лог потеряется
          git -c user.name="workday-ci" -c user.email="workday-ci@users.noreply.github.com" \
            pull -q --rebase origin ${{ github.ref_name }} || true
          git push -q origin HEAD:${{ github.ref_name }} || echo "пуш лога не удался"

      - name: Проверить APK
        if: steps.apk.outcome == 'success'
        run: |
          set -o pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          "$ANDROID_HOME"/build-tools/35.0.0/aapt2 dump badging "$APK" > /tmp/badging.txt
          grep -E "^package:|^sdkVersion|^application-label:|^launchable-activity" /tmp/badging.txt
          cp "$APK" WorkDay-debug.apk

      # Значения нужны, чтобы прописать вход в Google Cloud Console и assetlinks.json (docs/AUTH.md).
      # Ключ берётся из кэша выше, поэтому отпечаток совпадает от сборки к сборке.
      - name: Отпечатки ключа сборки
        if: steps.apk.outcome == 'success'
        run: |
          KS="$HOME/.android/debug.keystore"
          PKG=$(sed -nE "s/^package: name='([^']+)'.*/\1/p" /tmp/badging.txt | head -1)
          SHA1=""
          SHA256=""
          if [ -f "$KS" ]; then
            SHA1=$(keytool -list -v -keystore "$KS" -alias androiddebugkey -storepass android 2>/dev/null \
              | awk -F': ' '/SHA1:/{gsub(/ /,"",$2); print $2}' | head -1)
            SHA256=$(keytool -exportcert -keystore "$KS" -alias androiddebugkey -storepass android 2>/dev/null \
              | openssl dgst -sha256 -binary | openssl enc -base64 | tr '+/' '-_' | tr -d '=')
          fi
          { echo "PKG=$PKG"; echo "SHA1=$SHA1"; echo "SHA256=$SHA256"; } > /tmp/fp.env
          echo "package: $PKG" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-1: ${SHA1:-ключ не найден}" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256 (base64url): ${SHA256:-—}" >> "$GITHUB_STEP_SUMMARY"

      - name: Выложить артефактом
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: WorkDay-debug-apk
          path: WorkDay-debug.apk
          retention-days: 30

      - name: Опубликовать в релизе workday-latest
        if: steps.apk.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view workday-latest >/dev/null 2>&1; then
            gh release create workday-latest --target "${{ github.sha }}" \
              --title "Work Day — APK (свежая сборка)" \
              --notes "Debug-сборка ветки \`${{ github.ref_name }}\`, пересобирается CI автоматически.
          Android 8.0 (API 26) и выше. Смена из четырёх AI-агентов: прирост, привлечение, ускорение роста и активность для YouTube и TikTok.
          Ключ модели — свой, хранится на устройстве. Накрутки просмотров/подписчиков и автопостинга нет и не будет."
          fi
          gh release upload workday-latest WorkDay-debug.apk --clobber

          B=/tmp/badging.txt
          PKG=$(sed -nE "s/^package: name='([^']+)'.*/\1/p" $B | head -1)
          VER=$(sed -nE "s/.*versionName='([^']+)'.*/\1/p" $B | head -1)
          SDK=$(grep -oE "(minSdkVersion|sdkVersion):'[0-9]+'" $B | head -1 | grep -oE "[0-9]+")
          TGT=$(grep -oE "targetSdkVersion:'[0-9]+'" $B | head -1 | grep -oE "[0-9]+")
          LABEL=$(sed -nE "s/^application-label:'(.*)'.*/\1/p" $B | head -1)
          LAUNCH=$(sed -nE "s/^launchable-activity: name='([^']+)'.*/\1/p" $B | head -1)
          DEX=$(unzip -l WorkDay-debug.apk | grep -c '\.dex')
          SIZE=$(stat -c%s WorkDay-debug.apk)
          [ -f /tmp/fp.env ] && . /tmp/fp.env || true
          {
            echo "Debug-сборка ветки \`${{ github.ref_name }}\` — пересобирается CI при каждом пуше в \`android/\`."
            echo
            echo "| Проверено | Значение |"
            echo "|---|---|"
            echo "| Пакет / запуск | \`$PKG\` → \`$LAUNCH\` |"
            echo "| Название / версия | $LABEL $VER |"
            echo "| Android | min SDK $SDK (Android 8.0+), target $TGT |"
            echo "| dex-файлов | $DEX |"
            echo "| размер | $SIZE байт |"
            echo "| Юнит-тесты домена | пройдены (\`:app:testDebugUnitTest\`) |"
            echo
            echo "### Что это"
            echo "Смена из четырёх AI-агентов для роста на YouTube и TikTok: прирост, привлечение, ускорение и активность."
            echo
            echo "### После установки"
            echo "* Ключ модели не нужен для первого запуска: агенты работают на офлайн-движке. Свой OpenAI-совместимый ключ вводится в «Настройках» и хранится только на устройстве."
            echo "* Сборка подписана debug-ключом: при переустановке поверх новой версии иногда требуется удалить приложение."
            echo "* Накрутки просмотров/подписчиков и автопостинга нет и не будет — публикацию всегда подтверждаешь ты."
            if [ -n "${SHA1:-}" ]; then
              echo
              echo "### Если настраиваешь вход через Google"
              echo "OAuth-клиенту типа **Android** нужны пакет и отпечаток подписи этой сборки:"
              echo
              echo "\`\`\`"
              echo "package name: $PKG"
              echo "SHA-1:        $SHA1"
              echo "SHA-256:      $SHA256   # для .well-known/assetlinks.json"
              echo "\`\`\`"
              echo
              echo "Ключ лежит в кэше CI (\`workday-debug-keystore-v1\`) и не меняется от сборки к сборке — "
              echo "эти значения можно один раз вписать в консоль и забыть. Если кэш всё же сброшен, "
              echo "отпечаток сменится и Google ответит \`redirect_uri_mismatch\`: обнови SHA-1 в консоли. "
              echo "Локальную сборку подписывает твой собственный ключ в ~/.android — его напечатает tools/assetlinks.sh."
              echo "Пошаговая настройка входа — docs/AUTH.md."
            fi
          } > /tmp/notes.md
          gh release edit workday-latest --notes-file /tmp/notes.md
          echo "Ссылка: https://github.com/${{ github.repository }}/releases/download/workday-latest/WorkDay-debug.apk" >> "$GITHUB_STEP_SUMMARY"
