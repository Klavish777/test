name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Сборка debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Подготовить Android SDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Установить Gradle 8.7
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          sudo chmod +x /opt/gradle-8.7/bin/gradle
          /opt/gradle-8.7/bin/gradle --version | head -6

      - name: Собрать APK
        id: build
        working-directory: android
        run: |
          set -o pipefail
          /opt/gradle-8.7/bin/gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Сохранить лог сборки
        if: failure()
        working-directory: android
        run: |
          { grep -nE "error:|error|FAILURE|What went wrong" build.log | head -80; \
            echo "=== TAIL ==="; tail -c 3000 build.log; } > ../ci-build.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ../ci-build.log
          git commit -m "ci: лог сборки [skip ci]" || echo "нечего коммитить"
          git push origin HEAD:arena/0a0b42d6-test || echo "пуш не удался"

      - name: Выложить APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: creatorkit-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Опубликовать APK в релизах
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest "$APK" \
            --title "Продвижение — APK" \
            --notes "Автоматическая сборка ветки ${{ github.ref_name }}.
          Debug-сборка. Android 8.0 (API 26) и выше.
          Идеи, описания, план публикаций и аналитика для роста канала.
          Без накрутки просмотров и без автоматизации на платформах."
