name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    name: Сборка debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Подготовить Android SDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          which sdkmanager || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Установить Gradle 8.7
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          sudo chmod +x /opt/gradle-8.7/bin/gradle
          /opt/gradle-8.7/bin/gradle --version | head -6

      - name: Собрать APK
        working-directory: android
        run: /opt/gradle-8.7/bin/gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: farm-monitor-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
