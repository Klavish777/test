org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Страница-перехват для OAuth (нужна, чтобы провайдер вернул code в приложение).
# По умолчанию — GitHub Pages этого репозитория: Settings → Pages → Deploy from a branch →
# branch: main (или та, что вы пушите), folder: /docs. Файлы лежат в docs/auth-callback/.
# Если у своего хоста Pages нет — подставьте свой https-адрес и сюда, и в поле «Redirect URI»
# в настройках приложения, и в консоль провайдера.
workday.authCallbackHost=klavish777.github.io
workday.authCallbackPath=/auth-callback/
